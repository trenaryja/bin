[package]
name = "bin"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib/index.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dialoguer = "0.11"
indicatif = "0.17"
colored = "2"
jwalk = "0.8"

# --- git-ai-commit ---
[[bin]]
name = "git-ai-commit-rust"
path = "git-ai-commit/rust.rs"

# --- dux ---
[[bin]]
name = "dux-scan"
path = "dux/scanner.rs"

# --- future scripts: add a [[bin]] block here ---
